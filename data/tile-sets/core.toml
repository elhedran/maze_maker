# The core tile set (DR-0015), in the format of DR-0024.
#
# The adjacency table is calculated from this file (DR-0022):
#   entry = side-pair base x weight of row tile x weight of neighbour
#           x exception multiplier x noise factor
# and 0 wherever the facing sides may not meet. Which sides may meet is fixed
# in code (DR-0015), not here.
#
# Edit, save, and press Reload in the tool; no rebuild needed.
#
# Numbers: Wren's first pass (game-designer/1, 2026-10-31), retuned for the
# game in G.1 tuning (2026-11-01, variant v5; see docs/plans/g1-tuning.md).
# They aim at a hedge maze that is inviting to wander: plenty of hedge,
# winding corridors with a short walk between choices, rooms that feel like
# finds rather than wallpaper, and dead ends that are mostly nooks beside a
# junction rather than corridors to nowhere (DR-0016). Judged on 40 seeds of
# the walks example; still open to review.
#
# Tile order is table order: kind order (corridor, room, hedge), with
# fallbacks last within their kind (DR-0017 rule 8).

format = 1
name = "core"

# Opening pressure (DR-0036 rule 9): a piece whose open sides all face
# settled cells, so it opens nothing new, has its score multiplied by this.
# 0 < value <= 1; no key means 1. 0.5 is Wren's value for the single maze
# (game-designer/1, 2026-11-01): it lifts the worst mazes most and still lets
# loops form. See docs/plans/2.3-tuning-review.md. The grown world wants 1
# (docs/plans/g1-tuning.md); until the key is split, both read 0.5.
opening_pressure = 0.5

# Seeded variation on every allowed entry (DR-0024). amount = 0 turns it off.
# Kept as planned; Wren's DR-0013 concern about noise is on record, and the
# sample mazes will tell us whether 0.15 makes them samey or muddy.
[noise]
seed = 20261031
amount = 0.15

# One base per pair of side kinds that may meet. All six are required.
# Bases stay neutral where the tile weights already say what we want, so a
# number in the table is easy to trace to one cause.
[bases]
# Hedge against hedge is the fabric of the maze; neutral, the hedge tile's
# own weight carries "hedge is common".
hedge_hedge = 1.0
# Corridor joining corridor: the main way the player moves. Neutral.
passage_passage = 1.0
# A corridor arriving at a room's door: rooms should be reachable, so neutral.
passage_door = 1.0
# Doorway facing doorway: two rooms joined by a door with no corridor between.
# Rare (G.1: 0.3 -> 0.05): rooms chained door to door read as one cluster,
# and five rooms at once is no longer a find.
door_door = 0.05
# Open floor beside open floor: room interiors. Neutral.
floor_floor = 1.0
# Wall-edged floor continuing along a room's wall. Neutral, so room walls
# run on rather than breaking up.
floor_wall_floor_wall = 1.0

# Sides are N, E, S, W at rotation 0. Side kinds: hedge, passage, door,
# floor, floor_wall_n|e|s|w (floor with the room's wall at that end).

[[tile]]
id = "corridor_straight"
name = "Corridor straight"
kind = "corridor"
tags = []
sides = ["passage", "hedge", "passage", "hedge"]
orientations = 2
# Level with the corner (G.1: 1.0 -> 1.2, taking the T junction's share).
# Long straight runs are still damped by an exception below, so corridors
# wind rather than run on.
weight = 1.2

[[tile]]
id = "corridor_corner"
name = "Corridor corner"
kind = "corridor"
tags = []
sides = ["passage", "passage", "hedge", "hedge"]
orientations = 4
# Hedge mazes wind, and a turn hides what's next, which is where curiosity
# comes from.
weight = 1.2

[[tile]]
id = "corridor_t_intersection"
name = "Corridor T intersection"
kind = "corridor"
tags = ["junction"]
sides = ["passage", "passage", "hedge", "passage"]
orientations = 4
# Choices matter, but the rhythm should be walk, choose, walk, not choose,
# choose, choose (G.1: 0.6 -> 0.3).
weight = 0.3

[[tile]]
id = "corridor_crossroads"
name = "Corridor crossroads"
kind = "corridor"
tags = ["junction", "fallback"]
sides = ["passage", "passage", "passage", "passage"]
orientations = 1
# Fallback (DR-0016): very low. Four-way choices are disorienting and flatten
# the maze into a grid.
weight = 0.05

[[tile]]
id = "corridor_dead_end"
name = "Corridor dead end"
kind = "corridor"
tags = ["fallback"]
sides = ["passage", "hedge", "hedge", "hedge"]
orientations = 4
# Fallback (DR-0016), but a little higher (G.1: 0.05 -> 0.1) so the solver
# has a short nook to choose instead of winding a corridor into a trap. The
# exceptions below decide where it goes: beside a junction, not at the end
# of a long run.
weight = 0.1

[[tile]]
id = "open_room"
name = "Open room"
kind = "room"
tags = []
sides = ["floor", "floor", "floor", "floor"]
orientations = 1
# Room interiors: a clearing to arrive in. Slightly under corridor so rooms
# are places you find, not the default.
weight = 0.8

[[tile]]
id = "room_wall"
name = "Room wall"
kind = "room"
tags = ["room_edge"]
sides = ["hedge", "floor_wall_n", "floor", "floor_wall_n"]
orientations = 4
# Not rare (Ian): every room needs its walls, and a room that can't close
# off reads as a smear of floor.
weight = 1.0

[[tile]]
id = "room_corner"
name = "Room corner"
kind = "room"
tags = ["room_edge"]
sides = ["hedge", "hedge", "floor_wall_e", "floor_wall_n"]
orientations = 4
# Fewer than walls (a room has four corners but many wall tiles), but
# enough that rooms close into shapes.
weight = 0.7

[[tile]]
id = "room_doorway"
name = "Room doorway"
kind = "room"
tags = ["room_edge"]
sides = ["door", "floor_wall_n", "floor", "floor_wall_n"]
orientations = 4
# A grown world keeps only cells joined to what is stored (DR-0036), so a
# room only joins the world through a doorway: this weight sets how many
# rooms there are.
# G.1: 0.4 -> 0.1, so a room is entered every 60-100 steps and feels like a
# find. Walls, corners and floor are untouched so room sizes stay the same.
weight = 0.1

[[tile]]
id = "hedge"
name = "Hedge"
kind = "hedge"
tags = []
sides = ["hedge", "hedge", "hedge", "hedge"]
orientations = 1
# Common (DR-0016): solid hedge is what makes it a hedge maze and gives
# corridors their shape. G.1: 1.5 -> 2.5, for more hedge between paths and
# fewer corridors running shoulder to shoulder.
weight = 2.5

# Exceptions multiply particular pairs, both ways round (DR-0022). Each end
# names a tile (tile = "<id>") or a tag (tag = "<tag>") and the side it
# presents; side = "floor_wall" matches a wall at either end.

# Long straight runs are tedious and show you everything ahead; halve
# straight-into-straight so corridors bend more often than they run on.
[[exception]]
name = "Long straights are rarer than turns"
a = { tile = "corridor_straight", side = "passage" }
b = { tile = "corridor_straight", side = "passage" }
multiplier = 0.5

# Walking out of a room straight into a dead end feels like a trick.
[[exception]]
name = "Doorway rarely faces a dead end"
a = { tile = "room_doorway", side = "door" }
b = { tile = "corridor_dead_end", side = "passage" }
multiplier = 0.1

# G.1: a dead end right off a junction is a nook you can see the end of: a
# glance, no walk back. The tag also matches the crossroads.
[[exception]]
name = "Dead ends sit beside junctions"
a = { tag = "junction", side = "passage" }
b = { tile = "corridor_dead_end", side = "passage" }
multiplier = 10.0

# G.1: a dead end at the end of a long run is a corridor to nowhere, and the
# walk back is what costs patience. These two take long dead ends from about
# a quarter to under a tenth.
[[exception]]
name = "Dead ends rarely end a straight run"
a = { tile = "corridor_straight", side = "passage" }
b = { tile = "corridor_dead_end", side = "passage" }
multiplier = 0.15

[[exception]]
name = "Dead ends rarely end a winding run"
a = { tile = "corridor_corner", side = "passage" }
b = { tile = "corridor_dead_end", side = "passage" }
multiplier = 0.15
